[project]
name = "bot-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "enrico santoemma", email = "enrico.santoemma@all-well.it" }
]
requires-python = ">=3.12"
dependencies = [
    "ctranslate2>=4.8.2",
    "faster-whisper>=1.2.1",
    "livekit>=1.1.20",
    "piper-tts>=1.8.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
bot-agent = "bot_agent:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.17.1",
]
